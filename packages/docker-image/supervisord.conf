; ==========================================================================
; SQL Engine Laboratory — supervisord configuration
;
; Todos los programas están en autostart=false. El entrypoint.sh
; inicia solo el programa correspondiente al ENGINE seleccionado.
; ==========================================================================

[supervisord]
nodaemon=true
logfile=/var/log/sql-engine-lab/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/sql-engine-lab/supervisord.pid

[unix_http_server]
file=/var/run/sql-engine-lab/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/sql-engine-lab/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --------------------------------------------------------------------------
; PostgreSQL
; --------------------------------------------------------------------------
[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/sql-engine-lab/data/postgres -c listen_addresses='*' -c port=5432
user=postgres
autostart=false
autorestart=true
stdout_logfile=/var/log/sql-engine-lab/postgres.log
stderr_logfile=/var/log/sql-engine-lab/postgres-error.log
priority=100

; --------------------------------------------------------------------------
; MySQL
; --------------------------------------------------------------------------
[program:mysql]
command=/usr/sbin/mysqld --datadir=/var/lib/sql-engine-lab/data/mysql --socket=/var/run/sql-engine-lab/mysql.sock --port=3306 --bind-address=0.0.0.0 --user=mysql
autostart=false
autorestart=true
stdout_logfile=/var/log/sql-engine-lab/mysql.log
stderr_logfile=/var/log/sql-engine-lab/mysql-error.log
priority=100

; --------------------------------------------------------------------------
; MariaDB
; --------------------------------------------------------------------------
[program:mariadb]
command=/usr/sbin/mariadbd --datadir=/var/lib/sql-engine-lab/data/mariadb --socket=/var/run/sql-engine-lab/mariadb.sock --port=3307 --bind-address=0.0.0.0 --user=mysql
autostart=false
autorestart=true
stdout_logfile=/var/log/sql-engine-lab/mariadb.log
stderr_logfile=/var/log/sql-engine-lab/mariadb-error.log
priority=100

; --------------------------------------------------------------------------
; Oracle Free
; --------------------------------------------------------------------------
[program:oracle]
command=/opt/sql-engine-lab/engines/oracle/run.sh
user=oracle
autostart=false
autorestart=true
environment=ORACLE_HOME="/opt/oracle/product/23ai/dbhomeFree",ORACLE_SID="FREE",ORACLE_BASE="/opt/oracle",PATH="/opt/oracle/product/23ai/dbhomeFree/bin:%(ENV_PATH)s",LD_LIBRARY_PATH="/opt/oracle/product/23ai/dbhomeFree/lib",ORACLE_PASSWORD="%(ENV_LAB_PASSWORD)s"
stdout_logfile=/var/log/sql-engine-lab/oracle.log
stderr_logfile=/var/log/sql-engine-lab/oracle-error.log
startsecs=30
priority=100

; --------------------------------------------------------------------------
; SQL Server
; --------------------------------------------------------------------------
[program:sqlserver]
command=/opt/mssql/bin/sqlservr
autostart=false
autorestart=true
environment=ACCEPT_EULA="Y",MSSQL_SA_PASSWORD="%(ENV_LAB_PASSWORD)s",MSSQL_PID="Developer"
stdout_logfile=/var/log/sql-engine-lab/sqlserver.log
stderr_logfile=/var/log/sql-engine-lab/sqlserver-error.log
priority=100
